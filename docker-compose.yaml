name: recipevaultapp

services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: node ./bin/www.js
    env_file: ./.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
      - database-network

  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\"",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
    networks:
      - database-network

volumes:
  mongo-data:

networks:
  app-network:
  database-network:
    internal: true
