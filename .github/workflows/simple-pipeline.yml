name: Classroom CI-CD Demo 2026

on:
  push:
    branches: [ main ]

jobs:
  build_stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: |
          npm run build
          echo "Build completed successfully!"

  test_stage:
    needs: build_stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: |
          npm test
          echo "Tests passed successfully!"

  deploy_stage:
    needs: test_stage
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Deploy
        run: echo "Deployment completed successfully!"
